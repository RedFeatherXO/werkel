services:
  fleet-dashboard:
    build: .
    # or, once you have pushed it somewhere: image: your-registry/fleet-dashboard:latest
    container_name: fleet-dashboard
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - fleet-data:/data
    environment:
      # Required: only holders of this token can push job data.
      FLEET_INGEST_TOKEN: "${FLEET_INGEST_TOKEN:?set FLEET_INGEST_TOKEN in .env}"
      # Optional: set both to put a login in front of the browser view.
      DASHBOARD_USER: "${DASHBOARD_USER:-}"
      DASHBOARD_PASS: "${DASHBOARD_PASS:-}"
      # How many jobs to keep.
      RETENTION_JOBS: "${RETENTION_JOBS:-300}"
      TZ: "${TZ:-Europe/Berlin}"

volumes:
  fleet-data:
