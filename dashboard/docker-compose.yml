services:
  werkel-dashboard:
    build: .
    # or, once you have pushed it somewhere: image: your-registry/werkel-dashboard:latest
    container_name: werkel-dashboard
    restart: unless-stopped
    ports:
      - "7777:7777"
    volumes:
      - werkel-data:/data
    environment:
      # Required: only holders of this token can push job data.
      WERKEL_INGEST_TOKEN: "${WERKEL_INGEST_TOKEN:?set WERKEL_INGEST_TOKEN in .env}"
      # Optional: set both to put a login in front of the browser view.
      DASHBOARD_USER: "${DASHBOARD_USER:-}"
      DASHBOARD_PASS: "${DASHBOARD_PASS:-}"
      # How many jobs to keep.
      RETENTION_JOBS: "${RETENTION_JOBS:-300}"
      TZ: "${TZ:-Europe/Berlin}"

volumes:
  werkel-data:
