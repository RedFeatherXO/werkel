<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<!-- Inline, so the page stops asking for a favicon that was never served and
     leaving a 404 in everyone's console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Crect x='3.5' y='6.5' width='3' height='6' rx='1' fill='%23fff'/%3E%3Crect x='9.5' y='3.5' width='3' height='9' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --ink: #14161a; --muted: #6b7280;
    --running: #2563eb; --done: #16a34a; --failed: #dc2626; --timeout: #d97706; --cancelled: #6b7280; --queued: #8b5cf6;
    /* Diverging pair for the score column: blue and red read as opposites, and the
       midpoint is a neutral grey so "no adjustment" looks like nothing rather than
       like a third category. Validated for colour-vision deficiency (worst adjacent
       pair ΔE 21.6 under protanopia). The sign is always printed too, so the colour
       never carries the meaning on its own. */
    --pos: #2a78d6; --neg: #e34948; --mid: #f0efec;
    /* Petrol, two steps of one hue — a ranking is magnitude, and magnitude wants a
       sequential ramp, not two competing colours. Both clear 3:1 on this surface.
       The lighter step marks the part of a score the fleet earned itself. */
    --rank: #0f7a72; --rank-soft: #2d9c90; --rank-tint: #0f7a720d;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013; --panel: #161a1f; --line: #262b33; --ink: #e8eaed; --muted: #9aa3af;
      --running: #60a5fa; --done: #4ade80; --failed: #f87171; --timeout: #fbbf24; --cancelled: #9ca3af; --queued: #a78bfa;
      --pos: #3987e5; --neg: #e66767; --mid: #383835;
      --rank: #279189; --rank-soft: #37a89c; --rank-tint: #27918914;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 14px 20px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  h1 .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--done); margin-right: 8px; vertical-align: middle; }
  h1 .dot.stale { background: var(--cancelled); }
  .stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .filters { margin-left: auto; display: flex; gap: 6px; }
  .filters button {
    font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* display:flex on .filters beats the hidden attribute, so switching tabs left the
     job filters standing over a table they cannot filter. */
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; margin-right: 4px; }
  .tabs button {
    font: inherit; font-size: 12.5px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  main { padding: 20px; }

  .mwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
  table.models { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.models th {
    text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); padding: 11px 14px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.models td { padding: 9px 14px; vertical-align: middle; }
  /* Alternating rows instead of a line under each one: with thirty-odd models the
     eye needs to track a row across, and a tinted band does that better than a rule. */
  table.models tbody tr:nth-child(even) { background: var(--rank-tint); }
  table.models .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.models .rank { color: var(--muted); width: 1%; padding-right: 4px; }
  table.models .mdl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; white-space: nowrap; }
  table.models .note { color: var(--muted); font-size: 12px; max-width: 260px; }
  table.models .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

  /* The headline number, and the bar that makes thirty of them comparable. */
  .score { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .rankbar { display: block; position: relative; height: 10px; width: 100%; min-width: 150px; }
  .rankbar .base, .rankbar .gain, .rankbar .loss {
    position: absolute; top: 0; height: 10px;
  }
  /* 4px rounded at the data end, square at the baseline. */
  .rankbar .base { left: 0; background: var(--rank); border-radius: 0 4px 4px 0; }
  .rankbar .gain { background: var(--rank-soft); border-radius: 0 4px 4px 0; }
  /* What a model gave away: the outline of where its benchmark alone would have
     put it, so a negative adjustment is visible instead of merely absent. */
  .rankbar .loss {
    border: 1.5px solid var(--neg); border-left: 0; border-radius: 0 4px 4px 0;
    background: repeating-linear-gradient(135deg, transparent 0 3px, var(--neg) 3px 4px);
    opacity: .85;
  }
  .rankbar .tick { position: absolute; top: -2px; height: 14px; width: 1px; background: var(--ink); opacity: .35; }

  .score + .est { color: var(--muted); font-size: 13px; margin-left: 1px; }
  .delta { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.up { color: var(--rank); }
  .delta.down { color: var(--neg); }
  .delta.zero { color: var(--muted); opacity: .5; }

  #mnote { color: var(--muted); font-size: 12px; padding: 10px 2px 0; }
  .groups { display: flex; flex-direction: column; gap: 14px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .group {
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow);
  }
  .group summary {
    list-style: none; display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; cursor: pointer; user-select: none;
  }
  .group summary::-webkit-details-marker { display: none; }
  .group[open] summary { border-bottom: 1px solid var(--line); }
  .g-label { font-weight: 650; font-size: 13.5px; }
  .g-count, .g-cost { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .g-status { color: var(--failed); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group .forget {
    margin-left: auto; font: inherit; font-size: 12.5px; padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .group .forget:hover, .group .forget.arm {
    color: var(--failed); border-color: color-mix(in srgb, var(--failed) 40%, var(--line));
  }
  .group .grid { padding: 14px; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px 13px; cursor: pointer; box-shadow: var(--shadow);
    position: relative; overflow: hidden; text-align: left; font: inherit; color: inherit; width: 100%;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.07); }
  .card:focus-visible { outline: 2px solid var(--running); outline-offset: 2px; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--state); }
  .card[data-state="running"] { --state: var(--running); }
  .card[data-state="done"] { --state: var(--done); }
  .card[data-state="failed"] { --state: var(--failed); }
  .card[data-state="timeout"] { --state: var(--timeout); }
  .card[data-state="cancelled"] { --state: var(--cancelled); }
  .card[data-state="queued"] { --state: var(--queued); }

  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .badge {
    font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    color: var(--state); display: inline-flex; align-items: center; gap: 5px;
  }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--state); font-style: normal; }
  .card[data-state="running"] .badge i { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
  .card .when { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .card h2 { font-size: 14.5px; margin: 0 0 8px; font-weight: 600; line-height: 1.35; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 12.5px; }
  .meta span { font-variant-numeric: tabular-nums; }
  .model { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .card .err { margin-top: 8px; color: var(--failed); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .retry { margin-top: 7px; font-size: 12px; color: var(--timeout); }

  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .empty code { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: 12.5px; }

  dialog {
    border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--ink);
    width: min(860px, 94vw); max-height: 88vh; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(2px); }
  .sheet { display: flex; flex-direction: column; max-height: 88vh; }
  .sheet header { position: static; border-radius: 14px 14px 0 0; }
  .sheet .body { overflow: auto; padding: 18px 20px 22px; }
  .sheet h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 7px; font-weight: 600; }
  .sheet h3:first-child { margin-top: 0; }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; margin: 0;
    overflow-x: auto; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
  }
  pre.wide { white-space: pre; word-break: normal; }
  .files { list-style: none; margin: 0; padding: 0; font: 12.5px/1.8 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .files li::before { content: attr(data-status); display: inline-block; width: 1.4em; color: var(--muted); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--line); background: var(--panel); border-radius: 0 0 14px 14px; }
  .actions button {
    font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer;
  }
  .actions button:hover:not(:disabled) { border-color: var(--muted); }
  .actions button.danger { color: var(--failed); border-color: color-mix(in srgb, var(--failed) 40%, var(--line)); }
  .actions button:disabled { opacity: .45; cursor: default; }
  .actions .spacer { margin-left: auto; }
  .toast { font-size: 12.5px; color: var(--muted); align-self: center; }
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="live"></span>Fleet</h1>
  <div class="stats">
    <span><b id="s-queued">0</b> wartend</span>
    <span><b id="s-running">0</b> laufend</span>
    <span><b id="s-done">0</b> fertig</span>
    <span><b id="s-failed">0</b> fehlgeschlagen</span>
    <span><b id="s-cost">$0</b> gesamt</span>
    <span id="s-hosts"></span>
  </div>
  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="jobs" aria-selected="true">Jobs</button>
    <button role="tab" data-tab="models" aria-selected="false">Modelle</button>
  </div>
  <div class="filters" id="filters">
    <button data-filter="all" aria-pressed="true">Alle</button>
    <button data-filter="running" aria-pressed="false">Laufend</button>
    <button data-filter="queued" aria-pressed="false">Wartend</button>
    <button data-filter="done" aria-pressed="false">Fertig</button>
    <button data-filter="problem" aria-pressed="false">Probleme</button>
  </div>
</header>

<main>
  <div id="panel-jobs">
    <div class="groups" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div id="panel-models" hidden>
    <div class="mwrap"><table class="models" id="mtable"></table></div>
    <div id="mnote"></div>
    <div class="empty" id="mempty" hidden></div>
  </div>
</main>

<dialog id="sheet"><div class="sheet">
  <header><h1 id="d-title">…</h1><span class="when" id="d-when"></span></header>
  <div class="body" id="d-body"></div>
  <div class="actions">
    <button id="d-cancel" class="danger">Abbrechen</button>
    <button id="d-cleanup">Worktree aufräumen</button>
    <span class="toast" id="d-toast"></span>
    <span class="spacer"></span>
    <button id="d-close">Schließen</button>
  </div>
</div></dialog>

<script>
const $ = (id) => document.getElementById(id);
let jobs = [];
let models = [];
let tab = "jobs";
let filter = "all";
let openKey = null;
let armedDay = null;
let armTimer = null;
const groupStatus = {};
// Only what the user actually chose, day -> open?. Everything else falls back to
// the default below, so a fresh browser folds history away instead of showing
// every day it has ever seen.
let dayPrefs = {};
try {
  const stored = JSON.parse(localStorage.getItem("fleet.dayPrefs"));
  if (stored && !Array.isArray(stored) && typeof stored === "object") dayPrefs = stored;
} catch {}

const fmtCost = (n) => n == null ? "–" : (n === 0 ? "$0" : n < 0.01 ? "$" + n.toFixed(4) : "$" + n.toFixed(2));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function dur(job) {
  // durationMs is authoritative, but derive it when a reporter did not send it
  const finished = job.durationMs ?? (job.endedMs && job.startedMs ? job.endedMs - job.startedMs : null);
  const ms = job.state === "running" ? Date.now() - (job.startedMs ?? Date.now()) : (finished ?? 0);
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? s + "s" : Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0") + "s";
}
function ago(ms) {
  if (!ms) return "";
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return "gerade eben";
  if (s < 3600) return Math.floor(s / 60) + " min";
  if (s < 86400) return Math.floor(s / 3600) + " h";
  return Math.floor(s / 86400) + " d";
}
const shortModel = (m) => String(m ?? "").split("/").slice(-1)[0];

function matches(job) {
  if (filter === "all") return true;
  if (filter === "problem") return ["failed", "timeout", "cancelled"].includes(job.state);
  return job.state === filter;
}

/** Running first, then the queue in start order, then history. A waiting job has
 *  no startedMs, and sorting by that alone would push it below yesterday's work. */
function byInterest(a, b) {
  const rank = (j) => (j.state === "running" ? 0 : j.state === "queued" ? 1 : 2);
  const ra = rank(a), rb = rank(b);
  if (ra !== rb) return ra - rb;
  if (ra === 1) return (a.queuedAt ?? 0) - (b.queuedAt ?? 0);
  return (b.startedMs ?? 0) - (a.startedMs ?? 0);
}

function saveDayPrefs(visibleDays) {
  // Drop choices for days that have scrolled out of the data, so this cannot
  // quietly grow for as long as the dashboard is used.
  if (visibleDays) {
    for (const k of Object.keys(dayPrefs)) if (!visibleDays.has(k)) delete dayPrefs[k];
  }
  try { localStorage.setItem("fleet.dayPrefs", JSON.stringify(dayPrefs)); } catch {}
}

const dayKey = (ms) => {
  const d = new Date(ms);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};

function dayLabel(ms) {
  const d = new Date(ms);
  const now = new Date();
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if (day === new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()) return "Heute";
  if (day === new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1).getTime()) return "Gestern";
  return new Date(ms).toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
}

function buildGroups(list) {
  const active = [];
  const days = new Map();
  for (const j of list) {
    if (j.state === "running" || j.state === "queued") {
      active.push(j);
      continue;
    }
    const ms = j.endedMs ?? j.updatedAt ?? 0;
    const k = dayKey(ms);
    if (!days.has(k)) days.set(k, { day: k, label: dayLabel(ms), jobs: [] });
    days.get(k).jobs.push(j);
  }
  active.sort(byInterest);
  const groups = [...days.values()].sort((a, b) => b.day.localeCompare(a.day));
  for (const g of groups) g.jobs.sort(byInterest);
  return active.length ? [{ day: null, label: "Jetzt", jobs: active }, ...groups] : groups;
}

const cardHtml = (j) => `
    <button class="card" data-state="${esc(j.state)}" data-key="${esc(j.key)}">
      <div class="top">
        <span class="badge"><i></i>${esc(j.state)}</span>
        <span class="when">${j.state === "running" ? dur(j) : j.state === "queued" ? "wartet" : ago(j.endedMs || j.updatedAt)}</span>
      </div>
      <h2>${esc(j.title || j.jobId)}</h2>
      <div class="meta">
        <span class="model">${esc(shortModel(j.model))}</span>
        <span>${dur(j)}</span>
        <span>${fmtCost(j.costUsd)}</span>
        ${j.tools ? `<span>${esc(j.tools)}</span>` : ""}
        ${j.host ? `<span>${esc(j.host)}</span>` : ""}
      </div>
      ${j.previousAttempts?.length ? `<div class="retry">↻ Versuch ${esc(j.attempt || "2")} — vorher ${esc(shortModel(j.previousAttempts[0].split(":")[0]))}</div>` : ""}
      ${j.error ? `<div class="err">${esc(String(j.error).split("\n")[0])}</div>` : ""}
    </button>`;

function render() {
  const grid = $("grid");
  const list = jobs.filter(matches);
  const groups = buildGroups(list);
  const today = dayKey(Date.now());

  grid.innerHTML = groups.map((g) => {
    const cost = fmtCost(g.jobs.reduce((a, j) => a + (j.costUsd || 0), 0));
    // Today open, older days folded — unless the user said otherwise for that day.
    const open = g.day === null ? true : (dayPrefs[g.day] ?? (g.day === today));
    const armed = g.day !== null && armedDay === g.day;
    const status = g.day !== null && groupStatus[g.day] ? `<span class="g-status">${esc(groupStatus[g.day])}</span>` : "";
    const forget = g.day === null ? "" : `<button class="forget${armed ? " arm" : ""}" data-day="${esc(g.day)}">${armed ? "wirklich?" : "löschen"}</button>`;
    return `
    <details class="group"${g.day === null ? "" : ` data-day="${esc(g.day)}"`}${open ? " open" : ""}>
      <summary>
        <span class="g-label">${esc(g.label)}</span>
        <span class="g-count">${g.jobs.length}</span>
        <span class="g-cost">${cost}</span>
        ${status}
        ${forget}
      </summary>
      <div class="grid">${g.jobs.map(cardHtml).join("")}</div>
    </details>`;
  }).join("");

  const visibleDays = new Set(groups.map((g) => g.day).filter(Boolean));
  grid.querySelectorAll("details[data-day]").forEach((d) =>
    d.addEventListener("toggle", () => {
      dayPrefs[d.dataset.day] = d.open;
      saveDayPrefs(visibleDays);
    })
  );

  $("empty").hidden = list.length > 0;
  $("empty").innerHTML = jobs.length
    ? "Keine Jobs in dieser Ansicht."
    : `Noch keine Daten. Starte auf dem Rechner mit den Jobs:<br><br><code>ocfleet report --to ${esc(location.origin)}</code>`;

  const by = (s) => jobs.filter((j) => j.state === s).length;
  $("s-queued").textContent = by("queued");
  $("s-running").textContent = by("running");
  $("s-done").textContent = by("done");
  $("s-failed").textContent = jobs.filter((j) => ["failed", "timeout"].includes(j.state)).length;
  $("s-cost").textContent = fmtCost(jobs.reduce((a, j) => a + (j.costUsd || 0), 0));
}

function openSheet(key) {
  const j = jobs.find((x) => x.key === key);
  if (!j) return;
  openKey = key;
  $("d-title").textContent = j.title || j.jobId;
  $("d-when").textContent = `${j.state} · ${dur(j)} · ${fmtCost(j.costUsd)}`;

  const rows = [
    ["Job", j.jobId], ["Modell", j.model], ["Rechner", j.host], ["Repo", j.repo],
    ["Branch", j.branch], ["Worktree", j.dir], ["Tools", j.tools],
    ["Tokens", j.tokens ? `${j.tokens.input ?? 0} rein / ${j.tokens.output ?? 0} raus` : null],
    ["Commit", j.committed]
  ].filter(([, v]) => v);

  $("d-body").innerHTML = `
    <dl class="kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    ${j.previousAttempts?.length ? `<h3>Frühere Versuche</h3><pre>${esc(j.previousAttempts.join("\n"))}</pre>` : ""}
    ${j.error ? `<h3>Fehler</h3><pre>${esc(j.error)}</pre>` : ""}
    ${j.report ? `<h3>Bericht des Workers</h3><pre>${esc(j.report)}</pre>` : ""}
    ${j.diffstat ? `<h3>Änderungen</h3><pre class="wide">${esc(j.diffstat)}</pre>` : ""}
    ${j.changedFiles?.length ? `<h3>Dateien</h3><ul class="files">${j.changedFiles.map((f) => `<li data-status="${esc(f.status)}">${esc(f.path)}</li>`).join("")}</ul>` : ""}
    ${j.task ? `<h3>Auftrag</h3><pre>${esc(j.task)}</pre>` : ""}`;

  $("d-cancel").disabled = j.state !== "running";
  $("d-cleanup").disabled = j.state === "running" || !j.branch;
  $("d-toast").textContent = "";
  if (!$("sheet").open) $("sheet").showModal();
}

async function command(action) {
  if (!openKey) return;
  $("d-toast").textContent = "wird eingereiht…";
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(openKey)}/${action}`, { method: "POST" });
    const b = await r.json();
    $("d-toast").textContent = r.ok
      ? "eingereiht — wird beim nächsten Push ausgeführt"
      : (b.error || "fehlgeschlagen");
  } catch (e) {
    $("d-toast").textContent = "Dashboard nicht erreichbar";
  }
}

function forgetClick(day) {
  if (armedDay === day) {
    armedDay = null;
    clearTimeout(armTimer);
    forgetDay(day);
  } else {
    armedDay = day;
    delete groupStatus[day];
    clearTimeout(armTimer);
    armTimer = setTimeout(() => {
      armedDay = null;
      render();
    }, 4000);
  }
  render();
}

async function forgetDay(day) {
  const g = buildGroups(jobs.filter(matches)).find((x) => x.day === day);
  const keys = (g ? g.jobs : []).map((j) => j.key);
  let ok = false;
  try {
    const r = await fetch("/api/forget", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keys })
    });
    ok = r.ok;
    if (!ok) {
      const b = await r.json().catch(() => ({}));
      groupStatus[day] = b.error || "fehlgeschlagen";
    }
  } catch (e) {
    groupStatus[day] = "Dashboard nicht erreichbar";
  }
  if (ok) {
    delete groupStatus[day];
    load();
  } else {
    render();
  }
}

const MAX_SHIFT = 10;   // matches defaults.experienceMaxShift on the job machine

/** One diverging bar. The sign is printed next to it, so the colour is never the
 *  only thing carrying the meaning. */
function meter(bonus) {
  const v = Math.max(-MAX_SHIFT, Math.min(MAX_SHIFT, Number(bonus) || 0));
  const pct = Math.abs(v) / MAX_SHIFT * 50;
  const sign = v >= 0 ? "pos" : "neg";
  const label = (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(1);
  return `<span class="meter"><span class="track">` +
    (Math.abs(v) < 0.05 ? "" : `<span class="fill" data-sign="${sign}" style="width:${pct}%"></span>`) +
    `</span><b>${label}</b></span>`;
}

// Two decimals everywhere so the column lines up, three only where two would
// round a real price to zero. Stripping trailing zeros produced "$0." for a free
// model and mixed "$0.3" with "$2.50" in the same cell.
const money = (v) => v == null ? "?" : v === 0 ? "0" : v < 0.1 ? v.toFixed(3) : v.toFixed(2);
const fmtPrice = (p, c) => p == null ? "" : (p === 0 && c === 0) ? "frei" : `$${money(p)}/$${money(c)}`;
const fmtCtx = (n) => n == null ? "" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + "M" : Math.round(n / 1000) + "k";

/** One bar per model: length is the total, a tick marks where the benchmark alone
 *  put it, and the piece between them is what this fleet's own record added or cost. */
function rankbar(r, max) {
  const pct = (v) => Math.max(0, Math.min(100, (v / max) * 100));
  const base = r.base ?? 0, total = r.total ?? base;
  const lo = Math.min(base, total), hi = Math.max(base, total);
  const gain = total > base
    // 2px of surface between the two segments, so they read as two things
    ? `<span class="gain" style="left:calc(${pct(lo)}% + 2px);width:calc(${pct(hi) - pct(lo)}% - 2px)"></span>`
    : "";
  const loss = total < base
    ? `<span class="loss" style="left:calc(${pct(lo)}% + 2px);width:calc(${pct(hi) - pct(lo)}% - 2px)"></span>`
    : "";
  return `<span class="rankbar">
    <span class="base" style="width:${pct(lo)}%"></span>${gain}${loss}
    <span class="tick" style="left:${pct(base)}%"></span>
  </span>`;
}

function renderModels() {
  const t = $("mtable");
  if (!models.length) {
    t.innerHTML = "";
    $("mempty").hidden = false;
    $("mempty").innerHTML = "Keine Modelle gemeldet. Läuft der Reporter? Auf dem Rechner mit den Jobs " +
      "genügt <code>ocfleet dashboard</code> — der meldet sich selbst.";
    return;
  }
  $("mempty").hidden = true;
  const max = Math.max(...models.map((r) => Math.max(r.total ?? 0, r.base ?? 0)), 1);

  const row = (r, i) => {
    const note = (r.notes ?? []).map((n) => n.note).filter(Boolean)[0];
    const est = r.capabilitySource !== "artificial-analysis";
    const d = r.experience ?? 0;
    const delta = Math.abs(d) < 0.05
      ? `<span class="delta zero">±0</span>`
      : `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${Math.abs(d).toFixed(1)}</span>`;
    const meta = [fmtPrice(r.prompt, r.completion), fmtCtx(r.context),
      r.jobs ? `${r.jobs} Jobs` : ""].filter(Boolean).join("  ·  ");
    return `<tr>
      <td class="num rank">${i + 1}</td>
      <td>
        <div class="mdl">${esc(r.model)}</div>
        <div class="sub">${esc(meta)}${r.profiles?.length ? "  ·  " + esc(r.profiles.join(", ")) : ""}</div>
      </td>
      <td class="num"><span class="score">${(r.total ?? 0).toFixed(1)}</span>${est
        ? `<span class="est" title="kein veröffentlichter Benchmark — aus dem Namen geschätzt">~</span>` : ""}</td>
      <td style="width:32%">${rankbar(r, max)}</td>
      <td class="num" title="Basis ${(r.base ?? 0).toFixed(1)}${est ? " (aus dem Namen geschätzt)" : ""}">${delta}</td>
      <td class="note">${note ? esc(note) : ""}</td>
    </tr>`;
  };

  t.innerHTML = `<thead><tr>
      <th class="num">#</th><th>Modell</th>
      <th class="num" title="Basis-Score plus das, was diese Flotte gelernt hat">Gesamt</th>
      <th>Rangfolge <span style="text-transform:none;letter-spacing:0;font-weight:400">— Strich = Benchmark allein</span></th>
      <th class="num" title="Verschiebung durch eigene Erfahrung. Startet bei 0.">Erfahrung</th>
      <th>Zuletzt aufgefallen</th>
    </tr></thead><tbody>${models.map(row).join("")}</tbody>`;

  const used = models.filter((r) => r.jobs > 0).length;
  $("mnote").textContent = used
    ? `${models.length} routbare Modelle · ${used} davon mit eigener Erfahrung`
    : `${models.length} routbare Modelle · noch keine eigene Erfahrung — sie entsteht, sobald du einen Diff übernimmst oder fleet_rate benutzt`;
}

function setTab(name) {
  tab = name;
  for (const b of $("tabs").querySelectorAll("button")) b.setAttribute("aria-selected", String(b.dataset.tab === name));
  $("panel-jobs").hidden = name !== "jobs";
  $("panel-models").hidden = name !== "models";
  $("filters").hidden = name !== "jobs";      // the filters only mean anything for jobs
  if (name === "models") loadModels();
}

async function loadModels() {
  try {
    const r = await fetch("/api/models");
    models = (await r.json()).models || [];
  } catch { models = []; }
  renderModels();
}

async function load() {
  const r = await fetch("/api/jobs");
  const b = await r.json();
  jobs = b.jobs || [];
  const hosts = Object.entries(b.hosts || {});
  $("s-hosts").textContent = hosts.length
    ? hosts.map(([h, v]) => `${h} · ${ago(v.lastSeen)}`).join(" | ")
    : "kein Reporter verbunden";
  $("live").classList.toggle("stale", !hosts.some(([, v]) => Date.now() - v.lastSeen < 60000));
  render();
  if (openKey && $("sheet").open) openSheet(openKey);
}

$("grid").addEventListener("click", (e) => {
  const forget = e.target.closest(".forget");
  if (forget) {
    e.preventDefault();
    e.stopPropagation();
    forgetClick(forget.dataset.day);
    return;
  }
  const card = e.target.closest(".card");
  if (card) openSheet(card.dataset.key);
});
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  filter = b.dataset.filter;
  [...$("filters").children].forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
$("d-close").addEventListener("click", () => $("sheet").close());
$("sheet").addEventListener("close", () => { openKey = null; });
$("d-cancel").addEventListener("click", () => command("cancel"));
$("d-cleanup").addEventListener("click", () => command("cleanup"));

const es = new EventSource("/api/events");
es.addEventListener("job", load);
es.addEventListener("tick", load);
es.addEventListener("command", load);
// The bulk /api/forget broadcasts only this — without it a second open tab would
// keep showing the deleted cards until the next push happened to arrive.
es.addEventListener("forget", load);
// The ledger only changes when a job ends, so it is cheap to refresh on the same
// beat as everything else — but only while the table is actually on screen.
es.addEventListener("models", () => { if (tab === "models") loadModels(); });

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) setTab(b.dataset.tab);
});
es.onerror = () => $("live").classList.add("stale");

load();
setInterval(render, 1000);   // keep running durations ticking
setInterval(load, 15000);    // and survive a dropped event stream
</script>
</body>
</html>
